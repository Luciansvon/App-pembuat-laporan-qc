name: Android debug experiment

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android CPU architecture
        required: true
        type: choice
        default: x86_64
        options:
          - x86_64
          - arm64-v8a

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Prepare Android build host
        run: |
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake autopoint ccache cmake \
            libffi-dev libltdl-dev libtool libssl-dev lbzip2 pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pinned python-for-android
        run: |
          git clone --depth 1 --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git .artifacts/p4a
          test "$(git -C .artifacts/p4a rev-parse HEAD)" = \
            58d21141f17c889bf8585f5665921d72028f8831
          git -C .artifacts/p4a apply "$GITHUB_WORKSPACE/android/patches/webview.patch"
          python -m pip install --editable .artifacts/p4a
          python -m pip install 'Cython==3.3.0'
      - name: Prepare Inspectra payload
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          python tools/prepare_android.py --output .artifacts/android-stage
      - name: Build on-device APK
        shell: bash
        run: |
          set -o pipefail
          requirements="$(paste -sd, android/requirements.txt)"
          PYTHONPATH=.artifacts/p4a python -m pythonforandroid.toolchain apk \
            --private=.artifacts/android-stage \
            --package=com.luciansvon.inspectra \
            --name=Inspectra --version=0.1.0 --dist-name=inspectra \
            --bootstrap=webview --requirements="$requirements" --port=5000 \
            --local-recipes=android/p4a-recipes \
            --arch='${{ inputs.arch }}' --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_HOME/ndk/28.2.13676358" \
            --android-api=35 --ndk-api=24 \
            --icon=assets/qc-android.png --debug \
            2>&1 | tee .artifacts/android-build.log
      - name: Preserve APK and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspectra-android-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            *.apk
            dist/*.apk
            .artifacts/android-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
